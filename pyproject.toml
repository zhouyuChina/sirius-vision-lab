[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sirius-vision-lab"
version = "0.1.0"
description = "Image recognition API and review console"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: opt-in real API smoke tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/sirius_vision"]
