<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>追光 AI 视觉 · 管理</title><link rel="stylesheet" href="static/style.css"><script src="static/app.js" defer></script></head>
<body><main class="shell">
<header class="topbar"><div><p class="eyebrow">VISION CONSOLE</p><h1>追光 AI 视觉</h1><p class="subtle">每一次识别，都有据可查。</p></div><button id="logout" hidden>退出登录</button></header>
<p id="message" role="status" aria-live="polite"></p>
<section id="login" class="login-card" hidden><h2>登录管理后台</h2><p class="subtle">查看识别记录与人工复核结果</p><form id="login-form"><label for="password">管理口令</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">登录</button></form></section>
<section id="workspace" hidden><h2>近 7 天概览</h2><div id="stats" class="stats" aria-live="polite"></div>
<div class="workspace-head"><h2>识别记录</h2><button id="refresh">刷新</button></div>
<form id="filters" class="toolbar"><label>任务<select id="task"><option value="">全部任务</option><option value="avatar_tag">头像打标</option><option value="garment_attr">商品属性</option></select></label><label>状态<select id="status"><option value="">全部状态</option><option value="success">成功</option><option value="parse_error">解析失败</option><option value="provider_error">服务失败</option></select></label><label>开始日期<input id="date-from" type="date"></label><label>结束日期<input id="date-to" type="date"></label><button class="primary">筛选</button></form>
<div id="records" class="image-grid" aria-live="polite"></div><button id="more" hidden>加载更多</button></section>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-top"><h2 id="detail-title">识别详情</h2><button id="close" aria-label="关闭详情">关闭</button></div><div class="detail-layout"><img id="detail-image" alt="识别输入原图"><div><h3>输入参数</h3><pre id="input"></pre><h3>识别字段</h3><pre id="fields"></pre></div></div><div class="dialog-body"><details><summary>原始输出</summary><pre id="raw"></pre></details><p id="review-state"></p><label for="note">复核备注</label><textarea id="note" rows="3" maxlength="4000"></textarea><div class="review-actions"><button data-review="correct" class="primary">对</button><button data-review="wrong">错</button><button data-review="uncertain">存疑</button></div><p id="detail-message" role="status"></p></div></dialog>
</main></body></html>
