# Include this location inside the HTTPS server for 101.37.175.27.
# TLS certificate/listen directives remain in the parent server block.
location ^~ /vision/ {
    client_max_body_size 25m;

    proxy_pass http://127.0.0.1:8902/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_read_timeout 300s;

    # Keep image bodies and JSON errors exactly as returned by FastAPI.
    proxy_intercept_errors off;
    proxy_buffering on;
}
